services:
  postgres:
    container_name: c-postgres-indi
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sasa
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - indi
    restart: unless-stopped
  pgadmin:
    container_name: c-pgadmin-indi
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - indi

  rabbitmq:
    container_name: c-mq-rabbit-indi
    image: rabbitmq:3-management
    environment:
      RABBIT_DEFAULT_USER: guest
      RABBIT_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # rabbit mesage broker
      - "15672:15672" #  UI management - > http://localhost:15672
    networks:
      - indi
    restart: unless-stopped

volumes:
  postgres:
    name: postgres
  pgadmin:
    name: pgadmin
networks:
  indi:
    name: indi
    external: true
    #driver: bridge

