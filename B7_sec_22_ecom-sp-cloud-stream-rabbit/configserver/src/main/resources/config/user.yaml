spring:

  data:
    mongodb:
      uri: mongodb://localhost:27017/ #${MONGO_URI}
      database: db-user-indi #${DB_MONGO} #db-user-indi

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: "*"
  #zipkin
  tracing:
    sampling:
      probability: 1.0

  #http://localhost:8082/actuator/busrefresh

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true  

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7